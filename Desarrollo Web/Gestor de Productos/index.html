<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <link rel="stylesheet" href="style.css">
    <title>Technological Products</title>
</head>
<body>
    <header>
        <img src="assets/Logo-Tech_products.png" alt="Logo" class="logo">
        <form action="/buscar" method="get" class="searchForm">
            <input type="search" name="q" placeholder="Search..." aria-label="Buscar en el sitio" class="searchInput">
            <button type="submit" class="searchButton">
                <img src="assets/searchIcon.svg" alt="Search Icon">
            </button>
        </form>
        <span class="user-pic">MA</span>
    </header>
    <div class="container">
        <aside>
            <form action="" id="form" class="createForm">
                <label for="name">Product Name</label>
                <input id="name" type="text" required placeholder="Name" class="input-field">
                <label for="price">Price</label>
                <input type="number" id="price" required inputmode="numeric" pattern="[0-9]*" placeholder="Price" class="input-field">
                <label for="categories-selector">Category</label>
                <select name="categories" id="categories-selector">
                    <option value="" disabled selected hidden>Select category</option>
                    <option value="Computers">Computers</option>
                    <option value="Mobile">Mobile</option>
                    <option value="Audio">Audio</option>
                    <option value="Wearables">Wearables</option>
                    <option value="Redes">Redes</option>
                </select>
                <button type="submit" class="confirmButton">Confirm</button>
            </form>
        </aside>
        <main>
            <ul id="list">
            </ul>
        </main>
    </div>
    <script src="script.js"></script>
</body>
</html>l
